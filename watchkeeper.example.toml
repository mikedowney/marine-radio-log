# =====================================================================
#  Watchkeeper channel configuration
# =====================================================================
#
#  Edit this file instead of the program. It is read from the working
#  directory, then ~/watchkeeper.toml, then ~/watchkeeper/watchkeeper.toml.
#  Override with --config PATH.
#
#      python watchkeeper.py --list-presets
#      python watchkeeper.py --preset socal_low
#
#  Two rules constrain every preset, and both are checked at startup:
#
#   1. Every channel must sit inside the capture window. At 2.048 MSPS that
#      is center +/- 1.024 MHz in principle, but the tuner rolls off near the
#      edges, so aim to keep everything inside +/- 800 kHz. You get a warning
#      beyond that and an error beyond +/- 1.024 MHz.
#
#   2. Each channel's offset from center must be a whole multiple of 4 Hz
#      (1 / chunk length). Any center on a 12.5 kHz grid satisfies this for
#      standard channel plans. This lets the mixer oscillator be computed once
#      and reused with no phase discontinuity at the chunk seam.
#
#  Put the center where no channel sits: the tuner leaks a DC spike there.
#
# =====================================================================


# ---------------------------------------------------------------------
#  Storage
# ---------------------------------------------------------------------
#  The Pi runs from a microSD card, and the recordings are essentially all of
#  the write traffic: about 1.25 MB/min of audio against roughly 10 KB/min of
#  database. Putting just the audio on tmpfs removes around 99% of the writes
#  for the cost of some RAM.
#
#  The cost is that recordings do not survive a reboot. The database stays on
#  the card either way, and any row whose WAV has gone is dropped at startup,
#  so the log never lists something it cannot play.
#
#  THIS IS ALREADY SET UP. audio_dir stays commented out below because the
#  default (base_dir/audio) is exactly where the mount is. The live fstab line
#  on watchkeeper-pi is:
#
#    tmpfs /home/pi/watchkeeper/audio tmpfs \
#          defaults,nofail,noatime,size=768M,uid=1000,gid=1000,mode=0755 0 0
#
#  nofail matters: without it a mount that fails to come up blocks boot on a
#  headless machine. With it, boot continues and the writes land on the card
#  instead -- which the receiver warns about at startup, so watch for that
#  line rather than assuming the mount is there.
#
#  SIZING. Measured 3 Oct at max_messages = 1000: 1000 files, 240 MB, about
#  245 KB each (7.6 s average at 16 kHz / 16-bit = 32 KB/s). That is steady
#  state, not a point on the way up -- the ring is full, so 240 MB is the
#  ceiling. 768M is 32% used and holds roughly 2500 recordings, so
#  max_messages has room to grow to about 2000 before the mount constrains it.
#
#  Check it with:   df -h ~/watchkeeper/audio
#
#  A USB SSD is the other answer: keeps the recordings, removes the wear
#  question entirely, and costs a port.

[storage]
base_dir  = "~/watchkeeper"
# audio_dir = "~/watchkeeper/audio"    # point at a tmpfs mount to spare the card
# db_path   = "~/watchkeeper/watchkeeper.db"


[radio]
station_name = "Radio Log"   # title of the web page and exported transcripts

# Where the receiver is, in decimal degrees. The Coast Guard reads out
# positions constantly; these decide which of them are near enough to be worth
# a map link next to the message. Comment both out to turn position links off.
# A rough figure is fine -- it only has to be right to within a few miles.
home_lat     = 37.8060   # set this to where the receiver is
home_lon     = -122.4659
coord_max_nm = 500        # nautical miles; positions further off are ignored

# Poll the boat's own GPS instead of editing the figures above by hand. Signal
# K on the Cerbo serves exactly the shape this expects. A live fix always wins;
# home_lat/home_lon stay as the fallback for when the Cerbo is off or the
# network is down, and the last good fix is kept rather than discarded.
home_source  = "http://cerbo.local:3000/signalk/v1/api/vessels/self/navigation/position"
home_refresh_s = 300       # seconds between polls; 15 is the floor
sample_rate  = 2048000     # 2.048 MSPS. Lowering to 1024000 halves the span.
gain         = "15.7"      # dB. "0" selects the tuner's own AGC, NOT zero gain.
                           # Was 36.4, chosen for the old cabin dipole. On the
                           # masthead antenna 36.4 saturated the front end in
                           # 17 minutes out of 30; 25 does it in 8, with a
                           # noise floor 6 dB better. See the survey note under
                           # [preset.boat]. Then 25, 22.9, 16.6, 14.4, and
                           # now 15.7. When Ch14 (156.700, LA/LB VTS) keys up
                           # the whole 2 MHz window fills with a comb of false
                           # carriers on a 200 kHz spacing, each carrying real
                           # audible voice -- third-order intermodulation in
                           # the R828D's own LNA and mixer, which is what puts
                           # one transmission on several channels at once. It
                           # is not the channelizer (67 dB rejection measured
                           # at 200 kHz) and not ADC clipping (peaks sit 45 dB
                           # below full scale).
                           #
                           # Set it by raising the gain until bleedover
                           # appears and backing off one step: the comb is
                           # visible on a spectrum display long before it is
                           # audible in a transcript. bleedover.sql scores it
                           # from the log, grouped by this value.
                           #
                           # 14.4 was measured clean on 3 Oct: 2 coincident
                           # pairs in 1000 messages (0.2%), both at 300/350 kHz
                           # separation rather than the 200 kHz comb spacing,
                           # and both 1.3 s -- two people keying up at once,
                           # not intermod. Stepped back up to 15.7 to recover
                           # sensitivity, since the floor is ADC-limited and
                           # does NOT fall with gain: reference power held at
                           # -65.8/-65.9 dB across 16.6 -> 15.7 -> 14.4, so
                           # every step down is pure loss. 16.6 is the rung
                           # where the comb was last seen.
                           # Gain Settings are available in discrete steps
                           # 0.0   0.9   1.4   2.7   3.7   7.7   8.7  12.5  14.4  15.7
                           # 16.6  19.7  20.7  22.9  25.4  28.0  29.7  32.8  33.8  36.4
                           # 37.2  38.6  40.2  42.1  43.4  43.9  44.5  48.0  49.6
ppm          = "0"         # The RTL-SDR Blog V4 has a 1 PPM TCXO, so 0 is fine.
device_index = "0"
max_messages = 2000        # Recordings kept, deleted with their database row.
                           # Eviction is strictly oldest-first by message id.
                           # Nothing is ever dropped for transcribing badly --
                           # a message that has appeared in the log stays there
                           # until it is genuinely the oldest thing in it.
max_record_gb = 8.0        # Cap on --record raw I/Q files.
# --- Transcription ---------------------------------------------------------
# The encoder processes a padded 30-second window at a time, so a 2-second
# message costs about the same as a 25-second one. Longer clips are not one
# bigger pass: faster-whisper slides that same 30-second window along, so a
# 90-second bulletin is three windows, not a 90-second encode. What varies
# between clips is decoder work, and the two settings below are what control
# it.
model        = "medium.en"   # "base.en" is roughly 3x faster and noticeably
                            # less accurate. At the 10-14 dB signal-to-noise
                            # these captures actually have, keeping up is worth
                            # more than the accuracy difference.
cpu_threads  = 2            # Still 2, but no longer for the reason given here
                            # before. It was dropped from 3 when peak power was
                            # the binding constraint on the old cooler. With the
                            # new one the SoC peaks at 70 C against a 79 C pause
                            # threshold, so the thermal argument no longer holds
                            # and 3 is worth testing.
                            #
                            # IF YOU RAISE IT, RAISE OMP_NUM_THREADS TO MATCH.
                            # The systemd unit pins OMP_NUM_THREADS=2 and
                            # OPENBLAS_NUM_THREADS=1 specifically to stop
                            # OpenMP and BLAS spawning a thread per core on top
                            # of whatever this says. Changing one and not the
                            # other gives a worse result than either value on
                            # its own.
                            #
                            # Four cores total. The transcriber is niced to +10
                            # below the DSP, so it yields rather than starving
                            # capture -- but that protects the DSP's share of
                            # CPU, not its latency. At 3 threads the channelizer
                            # and everything else share one core.
beam_size    = 1            # Greedy. Roughly half the decoder work of 2, for a
                            # small accuracy cost that is hard to see at the
                            # 10-20 dB signal-to-noise these captures have.
temperatures = [0.0]        # Each extra entry is a COMPLETE re-decode, tried
                            # when the checks below fail. On noisy audio they
                            # fail often, so a three-entry ladder let a bad clip
                            # cost three full passes -- the source of the rtf=6
                            # and rtf=9 outliers. One entry caps the worst case.
compression_ratio_threshold = 2.4
# Used only to re-decode a clip whose first pass collapsed into a repetition
# loop, which is otherwise terminal when temperatures has a single entry: the
# ladder above is what normally breaks a loop. Costs one extra pass on clips
# that would be discarded whole, and nothing at all on everything else.
# Set to [] to disable and go back to discarding them.
loop_retry_temperatures = []

# How readily a transcript is marked "(unclear)" in the log rather than shown
# as fact. Whisper reports its own confidence per segment; these are where the
# cutoffs sit. Raise low_conf_avg_logprob toward 0 (say -0.7) and lower
# low_conf_no_speech (say 0.4) to flag more marginal output. Flagged messages
# keep their audio and stay in the list -- they are marked, not hidden.
low_conf_avg_logprob = -1.0
low_conf_no_speech   = 0.6


# ---------------------------------------------------------------------
#  Still [radio]: settings that apply to every preset
# ---------------------------------------------------------------------
#  EVERYTHING DOWN TO THE FIRST [preset.*] HEADER IS GLOBAL. The keys below
#  are read from [radio] and apply to all presets. Do not insert a [preset.*]
#  header above them -- the gate and output level would silently become
#  scoped to that preset, and the boat would stop gating.

# --- Output level ----------------------------------------------------------
# MOVE THESE TWO TOGETHER. Raising target_rms alone makes quiet clips
# relatively worse: they are the ones already pinned at max_norm_gain_db.
target_rms       = 0.2     # ~ -14 dBFS RMS. 0.1 is ~ -20 dBFS.
max_norm_gain_db = 26.0    # ceiling on the lift applied to a quiet clip

# --- Pre-transcription gate ------------------------------------------------
# The encoder pads every window to 30 seconds, so a 1-second clip costs nearly
# as much to decode as a 25-second one. Skipping the hopeless ones is the
# cheapest heat saving available.
#
# THE AUDIO IS ALWAYS KEPT. Only the decode is skipped: the row stays in the
# log marked "not transcribed", and the WAV is still playable.
#
# 55 was validated by listening over a 100-message log on 26 Sep: everything
# the gate rejected was static, everything above it was intelligible.
min_transcribe_quality = 55.0   # 0 disables
min_transcribe_s       = 2.0    # mic-pop cutoff; 0 disables
always_transcribe      = ["Ch16 Distress", "Ch22A USCG Info"]

# Readability at or above which a transcript is never discarded outright, only
# trimmed -- the guard that stops the repetition filter throwing away a station
# that identified itself three times. MUST stay above min_transcribe_quality
# or it is dead code; the receiver warns at startup if they are inverted.
keep_above_quality     = 60.0
[preset.socal_low]
# A note on the prompt further down: the phonetic alphabet is deliberately NOT
# in it. initial_prompt conditions the decoder on text as though it preceded
# the audio, so listing vocabulary makes the model likelier to emit those words
# when it cannot hear clearly. A confidently hallucinated "Alpha Bravo" reads
# as real and cannot be spotted; a garbled "B3OR" is visibly wrong. For a log
# meant to be trusted at a glance, obvious failure beats plausible invention.
# bench_whisper.py can measure this if you want to revisit it: it counts
# phonetic words emitted and reports them against WER.
#
# Re-centred from 125.200 after dropping Palm Springs and Joshua Control, which
# produced nothing over several sessions. Everything now sits within +/- 525 kHz
# instead of +/- 900, clear of the tuner's rolloff.
center_hz    = 124825000   # nothing transmits here, so the DC spike is harmless
mode         = "am"

# Filter and squelch. audio_hi_hz sets the top of the voice passband and the
# RF channel filter follows it automatically. Measured S/N on real airband
# captures is flat with frequency, so lowering this sounds much less hissy
# without recovering any words -- and below about 2000 Hz it starts costing
# intelligibility, because that is where the consonants are.
audio_hi_hz     = 2700
squelch_dbfs    = -70.0    # Absolute guard rail, NOT the usual threshold. It
                           # must sit clear of floor + open_margin_db or it
                           # silently becomes the operative threshold and stops
                           # tracking the noise floor -- which makes any gain or
                           # antenna comparison meaningless, because changing
                           # the floor then changes the effective squelch
                           # instead of leaving it fixed. Measured floors: about
                           # -51 dBFS indoors, -58 outdoors at 36.4 dB gain,
                           # -67 outdoors at 25 dB. -70 clears all of them.
open_margin_db  = 8.0      # dB above the floor measured on reference channels
close_margin_db = 5.0
hang_s          = 0.6      # carrier may drop this long without ending a message
preroll_s       = 0.12
tail_keep_s     = 0.12
min_message_s   = 0.7      # shorter bursts are discarded as clicks
max_message_s   = 30.0     # matches Whisper's encoder window

# Chosen from measured data, not guessed. In a sample run every message that
# Whisper found no speech in measured 6.8 to 7.9 dB, while everything that
# produced text measured 12.0 dB or better. 10 dB sits in the gap. Raise it if
# the list still fills with unreadable traffic; lower it if something useful
# starts disappearing.
min_snr_db      = 10.0
transcribe_backlog = 12    # Messages that may wait for transcription. The
                           # queue is served newest-first, so the top of the log
                           # stays current; anything evicted keeps its audio and
                           # is shown as "recorded, not transcribed" rather than
                           # claiming to still be in progress.

prompt = """
Southern California Approach, Los Angeles Center, LAX Tower, Hawthorne Ground,
Burbank Terminal Radar, Orange County Approach, Palm Springs Approach, cleared
for takeoff, cleared to land, runway two five left, runway seven right, line up
and wait, contact departure, squawk, ident, heavy, descend and maintain, climb
and maintain, flight level, turn left heading, traffic in sight, altimeter,
wind two seven zero at one zero, niner, tree, fife, roger, wilco, say again,
radar contact, good day.
"""

channels = [
  { name = "Coastal Intermediate",   freq = 124300000 },   # -525 kHz
  { name = "LAX West Arrivals",      freq = 124500000 },   # -325 kHz
  { name = "Burbank Terminal Radar", freq = 124600000 },   # -225 kHz
  { name = "LAX South Arrivals",     freq = 124900000 },   #  +75 kHz
  { name = "HHR Ground",             freq = 125100000 },   # +275 kHz
  { name = "Orange County Approach", freq = 125350000 },   # +525 kHz

  # Reference channels measure the noise floor so the squelch can be set from
  # data rather than a constant, and their absolute power detects an antenna
  # or connector coming loose. Park them 12.5 kHz off the 25 kHz airband grid
  # where nothing should ever transmit, and clear of the 125.001 MHz spur.
  { name = "ref-a", freq = 124712500, role = "reference" },
  { name = "ref-b", freq = 125187500, role = "reference" },

  # Dropped after producing nothing across several sessions. Both are 100+
  # miles away and well beyond VHF line of sight. Re-adding Joshua at 126.100
  # would also force the centre back to 125.200 and put two other channels at
  # the tuner's rolloff again, so it costs more than it looks.
  # { name = "Palm Springs Approach",   freq = 125250000 },
  # { name = "Joshua Control Approach", freq = 126100000 },
  #
  # HHR Tower on 121.100 cannot go here at any centre frequency: 121.100 to
  # 125.350 spans 4.25 MHz against an RTL-SDR ceiling of about 2.4 MSPS. It
  # would need its own preset and its own dongle.
]

# 125.001030 is a known oscillator spur on this dongle, not a channel.
# Leave it out; listing it would just fill the database with noise.


# ---------------------------------------------------------------------
#  AVIATION AM  --  Southern California, upper centre/tower block
# ---------------------------------------------------------------------
[preset.socal_high]
center_hz    = 133600000
mode         = "am"
audio_hi_hz  = 2700

prompt = """
Los Angeles Center, LAX Tower, high altitude sector, cleared for takeoff,
cleared to land, runway two five left, contact departure, squawk, heavy,
descend and maintain, climb and maintain, flight level, turn left heading,
radar contact, niner, tree, fife, roger, say again, good day.
"""

channels = [
  { name = "High Altitude Center",     freq = 132850000 },
  { name = "LAX Tower North",          freq = 133900000 },
  { name = "Inland Transition Sector", freq = 134350000 },
  { name = "ref-a", freq = 133312500, role = "reference" },
  { name = "ref-b", freq = 134112500, role = "reference" },
]


# =====================================================================
#  MARINE VHF  --  the eventual target.  --preset marine
# =====================================================================
#
#  Narrowband FM rather than AM, so the squelch changes too: an unmodulated FM
#  discriminator outputs loud hiss with no carrier, so carrier power is the
#  wrong discriminator. The FM path measures discriminator energy above the
#  voice band instead, which reads near 0.86 on noise and collapses toward 0
#  when a carrier appears. Those are fm_open_noise / fm_close_noise.

[preset.marine]
# The standard watch set for a boat in the LA/Long Beach area: calling,
# distress, bridge-to-bridge, vessel traffic, USCG liaison, and the
# non-commercial working channels. This is the preset for use ON THE WATER,
# where ship-to-ship traffic is in range. Several of these channels are silent
# at the home location -- see Marine_Home for a set chosen from what actually
# reaches the porch.
center_hz = 156762500
mode      = "nfm"

fm_open_noise       = 0.55   # below this: carrier present
fm_close_noise      = 0.75   # above this: carrier gone
fm_split_silence_s  = 1.2
fm_target_message_s = 10.0   # only affects continuously-keyed stations
max_message_s       = 30.0
min_snr_db          = 0.0    # deliberately off: on a distress channel a weak,
                             # garbled transmission may be the one that matters

# NO PROMPT ON MARINE PRESETS, deliberately. initial_prompt conditions the
# decoder on text as though it preceded the audio, which does not merely make
# hallucination likelier -- it makes it PLAUSIBLE. Unprompted, Whisper invents
# generic filler that the subtitle and loop filters catch. Prompted, it invents
# fluent marine phraseology that nothing can distinguish from real traffic.
#
# The earlier wording listed "mayday" and "securite" and produced a transcript
# reading "Securite securite, vessel mayday, this is the United States Coast..."
# on four seconds of noise -- a fabricated distress call, which is the worst
# output this program could make. The model knows those words without priming;
# the prompt only biased it toward reaching for them under uncertainty.
#
# A poorly transcribed real transmission is recoverable: the audio is kept and
# the text is marked unclear. A fabricated one that reads correctly is not.
#
# The old wording is below if you want to measure it rather than guess --
# bench_whisper.py has a no-prompt row for exactly this comparison.
#
# prompt = """
# Sector Los Angeles Long Beach, vessel traffic service, motor vessel, sailing
# vessel, tug and tow, switch and answer channel one six, channel two two alpha,
# channel one three, bridge to bridge, inbound, outbound, precautionary area,
# Angels Gate, Queens Gate, Long Beach Pilot, pilot boarding, over, out, roger,
# wilco, say again, standing by.
# """

channels = [
  { name = "Ch68 Recreation", freq = 156425000 },   # non-commercial working
  { name = "Ch09 Calling",    freq = 156450000 },   # boater calling
  { name = "Ch69 Recreation", freq = 156475000 },   # non-commercial working
  { name = "Ch12 Port Ops",   freq = 156600000 },   # port operations
  { name = "Ch13 Bridge",     freq = 156650000 },   # bridge to bridge
  { name = "Ch14 Traffic",    freq = 156700000 },   # LA/LB vessel traffic service
  { name = "Ch16 Distress",   freq = 156800000 },   # distress, safety and calling
  { name = "Ch22A USCG Info", freq = 157100000 },   # USCG liaison and MSI broadcasts
  # Interstitial, 12.5 kHz off the marine 25 kHz grid.
  { name = "ref-a", freq = 156537500, role = "reference" },
  { name = "ref-b", freq = 156737500, role = "reference" },
]


# ---------------------------------------------------------------------
#  MARINE VHF  --  at the boat, Long Beach
# ---------------------------------------------------------------------
#  From a two-hour rtl_power survey taken at the slip, 1440 sweeps at 5 s.
#  Two hours of scanning needed cleaning first: about 2% of sweeps showed
#  every channel in the band rising at once, which is marina interference
#  rather than traffic -- chargers and inverters. Scored on the 96% of sweeps
#  that were clean.
#
#  The difference from the porch is the whole point of moving. Ch13
#  bridge-to-bridge went from 0.1 to 2.3 minutes, and Ch76 and Ch77 appeared
#  from nothing to the top of the list. Those are low-power ship-to-ship
#  channels that cannot reach eleven miles inland, so this is vessel traffic
#  rather than shore stations. Signal peaks run 27-51 dB above the local
#  baseline here against 6-19 dB from the porch.
#
#  The noise floor is 11 dB higher than the porch -- a marina costs you that
#  -- but the signals gained far more than the floor rose.
#
#  Centre is 37.5 kHz clear of every channel and off the 25 kHz grid. Worst
#  offset is 725 kHz -- ref-b at 157.4875, moved out there on 25 Sep so the
#  antenna alarm sees both ends of the window. That is inside the +/- 800 kHz
#  guidance but no longer in the flat region, so ref-b sits on the tuner's
#  rolloff and reads a little low in absolute terms. Fine for the alarm, which
#  watches for a step change, but do not compare ref-a and ref-b levels to
#  each other. The voice channels are all within 337.5 kHz.
[preset.boat]
center_hz = 156762500
mode      = "nfm"

fm_open_noise       = 0.55
fm_close_noise      = 0.75
fm_split_silence_s  = 2.0
fm_target_message_s = 60.0
max_message_s       = 90.0
min_snr_db          = 0.0
carrier_tail_keep_s = 0.05

# transcribe_backlog is deliberately not set here: the program default is 12,
# which is the value wanted. Set it explicitly if that default ever changes.

vad_filter          = false
no_speech_threshold = 0.8
log_prob_threshold  = -1.5
fm_audio_hi_hz      = 3000

# Cap on decoder output, in tokens per second of audio -- the hard stop on a
# runaway repetition loop. Speech is four or five; eight is generous.
#
# DO NOT RAISE THIS ABOVE 14. The cap handed to the decoder is
# 30 * max_tokens_per_second + 16, against Whisper's 448-token context, and
# faster-whisper raises ValueError rather than clamping when it is exceeded.
# At 15 that is 466 and EVERY message fails to transcribe.
#
# This bit once already: the cap used to be scaled by clip length rather than
# window length, so when max_message_s went from 30 to 90 every bulletin over
# ~54 s asked for more than 448 tokens and died with "transcription failed"
# while short traffic kept working. Fixed in watchkeeper.py on 3 Oct by
# clamping to the 30 s window (WHISPER_WINDOW_S). max_new_tokens is applied
# per encoder window, not per clip, which is why window length is the right
# scale.
max_tokens_per_second       = 5
compression_ratio_threshold = 2.4
temperatures                = [0.0]

# Thermal governor. The Pi 5 starts pulling clocks back around 80 C, and
# transcription alone will hold it near there. Waiting before a decode costs
# latency, which is nearly free -- traffic is sparse and the log gets read
# after the fact -- while throttling slows the DSP as well and risks dropped
# chunks.
#
# 76/71 was costing more than it saved: on 28 Sep, 92 of 165 seconds were
# spent held at 77-78 C, over half the available decode time, to stay well
# inside a limit that was not being approached. 80/75 recovers that.
#
# Replaced 4 Oct. The old board sat under a Pi Active Cooler with the fan
# pinned to full from 40 C (fan_temp0..3 all at speed 255 in config.txt) and
# still could not keep up: it was effectively a bare SoC in a hot cabin. This
# is a new Pi 5 (8 GB) in an aluminium dual-fan case with a custom curve,
# picked from a five-way cooler comparison run before deployment.
#
# Same workload, same preset, both measured at the slip:
#
#                         cabin    SoC mean   SoC peak   rise above ambient
#   old cooler,  3 Oct    32.9 C    84.1 C     87.0 C         51.2 C
#   this cooler, 4 Oct    34.3 C    58.6 C     70.5 C         24.3 C
#
# A hotter cabin and a chip 25 C cooler. The rise above ambient more than
# halved, which at roughly 10 W puts this near 2.4 C/W against the old 5 --
# about what a well-seated cooler should give. Six hours, 128 messages, zero
# seconds held for heat, and the governor below never fired once.
#
# READ THE RISE, NOT THE ABSOLUTE TEMPERATURE. The cabin swings 12 C between
# a cool morning and a hot afternoon, and 80 C means something completely
# different at each end. On 3 Oct the governor was tuned three times against
# a moving ambient and made things worse each time, because thermal_resume_
# below had become unreachable without anyone noticing. The ambient trace on
# the thermal report exists to stop that happening again.
#
# The queue is newest-first, so whatever piles up during a pause is the oldest
# and least interesting. max_wait caps any single stall.

# --- Hallucination blocklist -----------------------------------------------
# Optional phrase list built by fetch_hallucinations.py from the public
# whisper-hallucinations dataset (Whisper run over noise-only clips, so the
# phrases are what it actually invents). The generator strips anything
# containing radio vocabulary before writing the file, and long generic
# phrases are only ever matched against a WHOLE transcript -- never as a
# substring -- so a real transmission cannot lose part of itself to it.
#
# "thank you" is the single most common hallucination and also constant on
# the radio; it is blocked only when it is the entire transcript. Said five
# times over, the repetition filters catch it regardless.
hallucination_list   = "~/hallucinations.json"

thermal_pause_above  = 79.0
thermal_resume_below = 75.0
thermal_max_wait_s   = 20.0

# No prompt: priming the decoder makes its inventions plausible rather than
# obviously wrong, which is the worse failure.

# Chosen for how this boat is actually used, not by survey activity alone.
# Ch68 and Ch69 carry recreational boat-to-boat traffic, which clusters around
# people heading out and coming back -- a two-hour midday scan can miss it
# entirely, so their absence from the survey means little.
#
# Ch76 (156.775) and Ch77 (156.825) topped that survey at 12.5 and 12.1 minutes
# and are deliberately absent: listening showed both are static. Every message
# arrived at 25.7-26.2 dB with a duration of 0.7-2.2 s, which is a repeating
# emitter. A spectrum scan cannot tell narrowband interference from traffic.
channels = [
