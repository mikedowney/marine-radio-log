# =====================================================================
#  NOAA WEATHER RADIO  --  continuous carrier test signal.  --preset wx
# =====================================================================
#
#  Unlike marine or aviation this station never stops transmitting, so the
#  carrier cannot mark message boundaries. The FM path splits on pauses in
#  speech instead, which is what fm_split_silence_s and fm_target_message_s
#  control. The two AIS channels are diagnostic rather than voice: if AIS
#  bursts start appearing, ship-borne VHF is reaching the antenna and marine
#  voice should be within reach.

[preset.wx]
center_hz = 162262500
mode      = "nfm"

fm_split_silence_s  = 1.2
fm_target_message_s = 10.0

prompt = """
National Weather Service coastal waters forecast, NOAA weather radio station
KWO37, small craft advisory, coastal flood advisory, high surf advisory, rip
current risk, surf heights, south swell, west swell, high tide, low tide, feet,
Pacific Daylight Time, sea temperature, air temperature, watches warnings and
advisories, knots, wave height.
"""

channels = [
  { name = "AIS-A", freq = 161975000, role = "diagnostic" },
  { name = "AIS-B", freq = 162025000, role = "diagnostic" },
  { name = "WX2",   freq = 162400000 },
  { name = "WX1",   freq = 162550000 },
  { name = "ref-a", freq = 162337500, role = "reference" },
  { name = "ref-b", freq = 162487500, role = "reference" },
]

[ai]
